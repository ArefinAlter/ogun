[package]
name = "ogun-keystore"
description = "Where Ogun keeps secret values on a desktop: the operating system's credential store, or an encrypted file under a passphrase. Names are listed; values are only ever handed out zeroizing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
base64.workspace = true
keyring-core = "1"
argon2 = "0.6"
chacha20poly1305 = "0.11"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
