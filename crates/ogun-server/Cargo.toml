[package]
name = "ogun-server"
description = "ogun-server: the self-hosted HTTPS bridge to ogund (users, workspaces, OIDC, Studio-web, MCP over HTTP, edge sync; Ogun spec O-13)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "ogun-server"
path = "src/main.rs"

[dependencies]
ogun-types.workspace = true
ogun-api.workspace = true
ogun-ir.workspace = true
zeus-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
tokio.workspace = true
redb.workspace = true
zeroize.workspace = true
getrandom.workspace = true
directories.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap.workspace = true
axum = { workspace = true, features = ["http2", "query"] }
tower.workspace = true
tower-http = { workspace = true, features = ["fs"] }
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["server", "server-auto", "tokio", "http1", "http2", "service"] }
http.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
reqwest.workspace = true
jsonwebtoken.workspace = true
url.workspace = true
sha2.workspace = true
base64.workspace = true
p256.workspace = true
ciborium.workspace = true
x509-cert.workspace = true
der.workspace = true
futures.workspace = true
tokio-util.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
