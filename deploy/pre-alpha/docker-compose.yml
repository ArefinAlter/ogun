# The hosted pre-alpha hub (README.md): the real ogund and ogun-server on sample data, Dex for sign-in, the
# pre-alpha service for the Studio screens ogund does not implement yet, and sample file servers. Every port is
# published on 127.0.0.1 only; the host's nginx terminates TLS for https://ogun.103.191.50.32.sslip.io.
#
#   127.0.0.1:18443  ogun-server (Studio-web, REST, MCP)        nginx: /
#   127.0.0.1:18444  Dex (sign-in pages, under /dex)            nginx: /dex/
#   127.0.0.1:18445  the pre-alpha service                      nginx: /svc/
#
# Networks: `core` is internal (no route out of the host): ogund runs the workflows there and can reach only the
# fixture servers. ogun-server and the service are also on `edge`, only so their ports can be published and
# ogun-server can fetch the OIDC discovery document through the public name.

name: ogun-prealpha

x-limits: &limits
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

x-ogun: &ogun
  <<: *limits
  image: ${OGUN_IMAGE:-ogun-prealpha:local}
  mem_limit: 2g
  cpus: 2
  pids_limit: 512
  environment:
    OGUN_HOME: /var/lib/ogun
    OGUN_LOG: ${OGUN_LOG:-info}
  volumes:
    - ogun-state:/var/lib/ogun

services:
  ogund:
    <<: *ogun
    command: ["ogund", "--profile", "server"]
    volumes:
      - ogun-state:/var/lib/ogun
      - ./seed:/srv/seed:ro
    networks: [core]

  ogun-server:
    <<: *ogun
    command: ["ogun-server", "serve", "--init-if-empty"]
    depends_on: [ogund]
    environment:
      OGUN_HOME: /var/lib/ogun
      OGUN_SERVER_HOME: /var/lib/ogun/ogun-server
      OGUN_SERVER_CONFIG: /etc/ogun/server.json
      OGUN_LOG: ${OGUN_LOG:-info}
    volumes:
      - ogun-state:/var/lib/ogun
      - ./server.json:/etc/ogun/server.json:ro
      - ./secrets/oidc-client-secret:/etc/ogun/secrets/oidc-client-secret:ro
    extra_hosts:
      - "ogun.103.191.50.32.sslip.io:host-gateway"
    ports:
      - "127.0.0.1:18443:8080"
      - "127.0.0.1:18444:18444"
    networks:
      core: { ipv4_address: 172.30.10.20 }
      edge: { ipv4_address: 172.30.11.20 }

  dex:
    <<: *limits
    image: ghcr.io/dexidp/dex:v2.41.1
    network_mode: "service:ogun-server"
    depends_on: [ogun-server]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    env_file: ./secrets/dex.env
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro

  svc:
    <<: *limits
    image: ogun-prealpha-svc:local
    depends_on: [ogun-server]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    environment:
      OGUN_SERVER_URL: http://ogun-server:8080
      OGUN_PUBLIC_URL: https://ogun.103.191.50.32.sslip.io
      SVC_AGENT_TOKEN_FILE: /run/secrets/agent-token
      SVC_SAMPLE_LOGIN: sample@example.org
      SVC_SAMPLE_PASSWORD_FILE: /run/secrets/sample-password
      SVC_RESET_AT: "03:00 UTC"
    volumes:
      - svc-data:/data
      - ./secrets/agent-token:/run/secrets/agent-token:ro
      - ./secrets/sample-password:/run/secrets/sample-password:ro
    ports:
      - "127.0.0.1:18445:8090"
    networks:
      core: { ipv4_address: 172.30.10.30 }
      edge: { ipv4_address: 172.30.11.30 }

  fixture:
    <<: *limits
    image: nginx:1.27-alpine
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    volumes:
      - ./fixture/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fixture/files:/srv/files:ro
    networks:
      core:
        ipv4_address: 172.30.10.40
        aliases: [files.example.org, weather.example.org]

networks:
  core:
    internal: true
    ipam: { config: [{ subnet: 172.30.10.0/24 }] }
  edge:
    ipam: { config: [{ subnet: 172.30.11.0/24 }] }

volumes:
  ogun-state:
  svc-data:
