# /etc/nginx/sites-available/ogun-prealpha: the hosted Ogun pre-alpha hub (deploy/pre-alpha/README.md).
# Only this file belongs to Ogun; edit, test and reload under `flock /tmp/verne-nginx.lock`.

limit_req_zone $binary_remote_addr zone=ogun_prealpha:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ogun_prealpha_auth:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ogun.103.191.50.32.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ogun.103.191.50.32.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/ogun.103.191.50.32.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ogun.103.191.50.32.sslip.io/privkey.pem;

    client_max_body_size 2m;
    # No HSTS on an sslip.io name. The application sets its own CSP and frame rules.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;

    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }

    # Sign-in pages (Dex) and the sign-in routes are rate-limited harder.
    location /dex/ {
        limit_req zone=ogun_prealpha_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:18444;
    }
    location /auth/ {
        limit_req zone=ogun_prealpha_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:18443;
    }

    # The pre-alpha service: agent threads and the settings ogund does not implement yet.
    location /svc/ {
        limit_req zone=ogun_prealpha burst=60 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:18445;
    }

    # Server-Sent Events: no buffering, long reads.
    location /api/v1/events {
        limit_req zone=ogun_prealpha burst=20 nodelay;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_pass http://127.0.0.1:18443;
    }

    location / {
        limit_req zone=ogun_prealpha burst=80 nodelay;
        proxy_pass http://127.0.0.1:18443;
    }
}
