# The sample file servers of the hosted hub. Reachable only inside the compose network ("internal: true"); the
# workflows' allowed_domains name these hosts and nothing else.
server {
    listen 80 default_server;
    server_name files.example.org;
    root /srv/files;
    autoindex off;
    types { text/csv csv; application/json json; text/plain txt; text/html html; }
    default_type application/octet-stream;
    location / { try_files $uri =404; }
}

# A weather service that is down, so ridership-forecast fails the way it would during a provider outage.
server {
    listen 80;
    server_name weather.example.org;
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nAllow: /\n"; }
    location / { default_type application/json; return 503 '{"error":"the forecast service is unavailable"}'; }
}
