{{- if and (not .Values.oidc.existingSecret) .Values.oidc.clientSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ogun.fullname" . }}-oidc
  labels:
    {{- include "ogun.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.oidc.clientSecrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
