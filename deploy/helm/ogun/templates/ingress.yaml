{{- if .Values.ingress.enabled }}
{{- $host := (split ":" (include "ogun.host" .))._0 }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ogun.fullname" . }}
  labels:
    {{- include "ogun.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - secretName: {{ .secretName }}
      hosts:
        - {{ $host }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ogun.fullname" . }}
                port:
                  name: http
{{- end }}
