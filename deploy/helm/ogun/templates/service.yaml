apiVersion: v1
kind: Service
metadata:
  name: {{ include "ogun.fullname" . }}
  labels:
    {{- include "ogun.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ogun.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ogun.fullname" . }}-headless
  labels:
    {{- include "ogun.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "ogun.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
