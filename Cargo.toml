[workspace]
resolver = "3"
members = [
    "crates/ogun-types",
    "crates/ogun-platform",
    "crates/ogun-keystore",
    "crates/ogun-sandbox",
    "crates/ogun-connectors",
    "crates/ogun-ir",
    "crates/ogun-run",
    "crates/ogun-sched",
    "crates/ogun-store",
    "crates/ogun-stream",
    "crates/ogun-edge",
    "crates/ogun-api",
    "crates/ogun-ops",
    "crates/ogun-daemon",
    "crates/ogun-llm",
    "crates/ogun-op-llm",
    "crates/ogun-op-shims",
    "crates/ogun-cli",
    "crates/ogun-ingest",
    "crates/ogun-sync",
    "crates/ogun-lsp",
    "crates/ogun-lineage",
    "crates/ogun-bench",
    "crates/ogun-zeus-bridge",
    "crates/ogun-server",
]
# Ogun Studio (Tauri) is its own workspace (ADR 0009), so webview and mobile dependencies stay out of daemon builds.
exclude = ["apps/studio"]

[workspace.package]
version = "0.0.1-beta.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/ArefinAlter/ogun"
authors = ["Ogun contributors"]
publish = false

# Same lint policy as zeus-core. Every crate adds `#![forbid(unsafe_code)]` to its lib.rs or main.rs.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"

[workspace.dependencies]
win32job = "2"
# ---- this workspace ----
ogun-types = { path = "crates/ogun-types", version = "0.0.1-beta.1" }
ogun-platform = { path = "crates/ogun-platform", version = "0.0.1-beta.1" }
ogun-keystore = { path = "crates/ogun-keystore", version = "0.0.1-beta.1" }
ogun-connectors = { path = "crates/ogun-connectors", version = "0.0.1-beta.1" }
ogun-sandbox = { path = "crates/ogun-sandbox", version = "0.0.1-beta.1" }
ogun-ir = { path = "crates/ogun-ir", version = "0.0.1-beta.1" }
ogun-run = { path = "crates/ogun-run", version = "0.0.1-beta.1" }
ogun-sched = { path = "crates/ogun-sched", version = "0.0.1-beta.1" }
ogun-store = { path = "crates/ogun-store", version = "0.0.1-beta.1" }
ogun-stream = { path = "crates/ogun-stream", version = "0.0.1-beta.1" }
ogun-edge = { path = "crates/ogun-edge", version = "0.0.1-beta.1" }
ogun-api = { path = "crates/ogun-api", version = "0.0.1-beta.1" }
ogun-ops = { path = "crates/ogun-ops", version = "0.0.1-beta.1" }
ogun-daemon = { path = "crates/ogun-daemon", version = "0.0.1-beta.1" }
ogun-llm = { path = "crates/ogun-llm", version = "0.0.1-beta.1" }
ogun-sync = { path = "crates/ogun-sync", version = "0.0.1-beta.1" }
ogun-lsp = { path = "crates/ogun-lsp", version = "0.0.1-beta.1" }
ogun-lineage = { path = "crates/ogun-lineage", version = "0.0.1-beta.1" }
ogun-bench = { path = "crates/ogun-bench", version = "0.0.1-beta.1" }
ogun-zeus-bridge = { path = "crates/ogun-zeus-bridge", version = "0.0.1-beta.1" }

# ---- zeus-core, as a sibling checkout (ADR 0002; never the zeus app repository) ----
zeus-types = { path = "../zeus-core/crates/zeus-types", version = "0.1.0" }
zeus-verify = { path = "../zeus-core/crates/zeus-verify", version = "0.1.0" }
zeus-artifact = { path = "../zeus-core/crates/zeus-artifact", version = "0.1.0" }
zeus-engine = { path = "../zeus-core/crates/zeus-engine", version = "0.1.0" }
zeus-fs = { path = "../zeus-core/crates/zeus-fs", version = "0.1.0" }
zeus-http = { path = "../zeus-core/crates/zeus-http", version = "0.1.0" }
zeus-session = { path = "../zeus-core/crates/zeus-session", version = "0.1.0" }
zeus-journal = { path = "../zeus-core/crates/zeus-journal", version = "0.1.0" }
zeus-control = { path = "../zeus-core/crates/zeus-control", version = "0.1.0" }

# ---- third party, versions aligned with zeus-core and zeus ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = "3"
# Same embedded database and version line as the zeus-core journal (MSRV 1.90).
redb = "4.3"
tempfile = "3.27"
blake3 = "1.8"
# ---- runtime: async, IPC, paths (versions as in the zeus app workspace) ----
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "fs", "process", "signal"] }
directories = "6"
zeroize = { version = "1.9", features = ["derive"] }
getrandom = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
rustix = { version = "1", features = ["process", "fs"] }
# Win32 calls for the Windows peer check and operator sandbox (crates/ogun-platform only).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemServices", "Win32_Security_Isolation", "Win32_System_Console"] }
# ---- crypto for WebAuthn approver assertions (O-15 section 7); sha2 and base64 as in the zeus app ----
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std", "pkcs8"] }
sha2 = "0.11"
base64 = "0.23"
jsonschema = { version = "0.58", default-features = false }
anyhow = "1"
# Terminal input without echo for `ogun secrets set` (same version as the zeus TUI).
crossterm = "0.29"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
# ---- model providers (ogun-llm; same version line and TLS stack as the zeus app) ----
# `rustls` (the default provider) for the model and sync clients; ogun-server installs ring for its listener.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-no-provider", "http2", "json", "stream", "system-proxy"] }
url = { version = "2.5", features = ["serde"] }
# ---- ingest bridge and edge sync (O-10, O-11); versions as in the zeus app workspace where it pins them ----
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
ed25519-dalek = { version = "3.0", features = ["zeroize"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp", "rtu"] }
# Platform trust roots for MQTT over TLS; already in the tree through rumqttc.
rustls-native-certs = "0.8"
# ---- language server (ogun-lsp): synchronous scaffold and protocol types ----
lsp-server = "0.10"
lsp-types = "0.97"
# ---- benchmark task formats (O-06): Harbor task.toml, ADE-bench task.yaml ----
toml = "1.1"
serde_yaml = "0.9"
# ---- ogun-server: the HTTPS bridge (O-13); version lines as in the zeus workspace where it pins them ----
tower = "0.5"
tower-http = { version = "0.6", default-features = false }
hyper = { version = "1.11", default-features = false }
hyper-util = { version = "0.1", default-features = false }
http = "1.5"
# TLS through rustls with the ring provider (no C build of aws-lc-sys; see zeus-core's "HTTP stack" note).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
jsonwebtoken = { version = "10.4", default-features = false, features = ["rust_crypto"] }
ciborium = "0.2"
x509-cert = { version = "0.2", default-features = false }
der = "0.7"
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
# ---- operators (ogun-ops; versions as in zeus-core and the zeus app workspace where they pin one) ----
async-trait = "0.1"
futures = "0.3"
bytes = "1.12"
scraper = "0.27"
jsonpath-rust = "1.0"
regex = "1.13"
# SQLite for the `export` operator and connection tests (bundled: no system library needed).
rusqlite = { version = "0.41", features = ["bundled"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
tar = "0.4"
flate2 = "1.1"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
