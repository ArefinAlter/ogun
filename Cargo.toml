[workspace]
resolver = "3"
members = [
    "crates/ogun-types",
    "crates/ogun-ir",
    "crates/ogun-run",
    "crates/ogun-sched",
    "crates/ogun-store",
    "crates/ogun-stream",
    "crates/ogun-edge",
    "crates/ogun-api",
    "crates/ogun-ops",
    "crates/ogun-daemon",
    "crates/ogun-llm",
    "crates/ogun-op-llm",
    "crates/ogun-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/ArefinAlter/ogun"
authors = ["Ogun contributors"]
publish = false

# Same lint policy as zeus-core. Every crate adds `#![forbid(unsafe_code)]` to its lib.rs or main.rs.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"

[workspace.dependencies]
# ---- this workspace ----
ogun-types = { path = "crates/ogun-types", version = "0.1.0" }
ogun-ir = { path = "crates/ogun-ir", version = "0.1.0" }
ogun-run = { path = "crates/ogun-run", version = "0.1.0" }
ogun-sched = { path = "crates/ogun-sched", version = "0.1.0" }
ogun-store = { path = "crates/ogun-store", version = "0.1.0" }
ogun-stream = { path = "crates/ogun-stream", version = "0.1.0" }
ogun-edge = { path = "crates/ogun-edge", version = "0.1.0" }
ogun-api = { path = "crates/ogun-api", version = "0.1.0" }
ogun-ops = { path = "crates/ogun-ops", version = "0.1.0" }
ogun-daemon = { path = "crates/ogun-daemon", version = "0.1.0" }
ogun-llm = { path = "crates/ogun-llm", version = "0.1.0" }

# ---- zeus-core, as a sibling checkout (ADR 0002; never the zeus app repository) ----
zeus-types = { path = "../zeus-core/crates/zeus-types", version = "0.1.0" }
zeus-verify = { path = "../zeus-core/crates/zeus-verify", version = "0.1.0" }
zeus-artifact = { path = "../zeus-core/crates/zeus-artifact", version = "0.1.0" }
zeus-engine = { path = "../zeus-core/crates/zeus-engine", version = "0.1.0" }
zeus-fs = { path = "../zeus-core/crates/zeus-fs", version = "0.1.0" }
zeus-control = { path = "../zeus-core/crates/zeus-control", version = "0.1.0" }

# ---- third party, versions aligned with zeus-core and zeus ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = "3"
# Same embedded database and version line as the zeus-core journal (MSRV 1.90).
redb = "4.3"
tempfile = "3.27"
blake3 = "1.8"
# ---- runtime: async, IPC, paths (versions as in the zeus app workspace) ----
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "fs", "process", "signal"] }
directories = "6"
zeroize = { version = "1.9", features = ["derive"] }
getrandom = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
rustix = { version = "1", features = ["process", "fs"] }
# ---- crypto for WebAuthn approver assertions (O-15 section 7); sha2 and base64 as in the zeus app ----
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.11"
base64 = "0.23"
jsonschema = { version = "0.58", default-features = false }
anyhow = "1"
# Terminal input without echo for `ogun secrets set` (same version as the zeus TUI).
crossterm = "0.29"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
# ---- model providers (ogun-llm; same version line and TLS stack as the zeus app) ----
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "system-proxy"] }
url = "2.5"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
