[workspace]
resolver = "3"
members = [
    "crates/ogun-types",
    "crates/ogun-ir",
    "crates/ogun-run",
    "crates/ogun-sched",
    "crates/ogun-store",
    "crates/ogun-stream",
    "crates/ogun-edge",
    "crates/ogun-api",
    "crates/ogun-ops",
    "crates/ogun-cli",
    "crates/ogun-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/ArefinAlter/ogun"
authors = ["Ogun contributors"]
publish = false

# Same lint policy as zeus-core. Every crate adds `#![forbid(unsafe_code)]` to its lib.rs or main.rs.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"

[workspace.dependencies]
# ---- this workspace ----
ogun-types = { path = "crates/ogun-types", version = "0.1.0" }
ogun-ir = { path = "crates/ogun-ir", version = "0.1.0" }
ogun-run = { path = "crates/ogun-run", version = "0.1.0" }
ogun-sched = { path = "crates/ogun-sched", version = "0.1.0" }
ogun-store = { path = "crates/ogun-store", version = "0.1.0" }
ogun-stream = { path = "crates/ogun-stream", version = "0.1.0" }
ogun-edge = { path = "crates/ogun-edge", version = "0.1.0" }
ogun-api = { path = "crates/ogun-api", version = "0.1.0" }
ogun-ops = { path = "crates/ogun-ops", version = "0.1.0" }

# ---- zeus-core, as a sibling checkout (ADR 0002; never the zeus app repository) ----
zeus-types = { path = "../zeus-core/crates/zeus-types", version = "0.1.0" }
zeus-verify = { path = "../zeus-core/crates/zeus-verify", version = "0.1.0" }
zeus-artifact = { path = "../zeus-core/crates/zeus-artifact", version = "0.1.0" }
zeus-engine = { path = "../zeus-core/crates/zeus-engine", version = "0.1.0" }
zeus-fs = { path = "../zeus-core/crates/zeus-fs", version = "0.1.0" }

# ---- third party, versions aligned with zeus-core and zeus ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = "3"
# Same embedded database and version line as the zeus-core journal (MSRV 1.90).
redb = "4.3"
tempfile = "3.27"
blake3 = "1.8"
# ---- runtime: async, IPC, paths (versions as in the zeus app workspace) ----
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "fs", "process", "signal"] }
directories = "6"
zeroize = { version = "1.9", features = ["derive"] }
getrandom = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
rustix = { version = "1", features = ["process", "fs"] }
jsonschema = { version = "0.58", default-features = false }
anyhow = "1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
# ---- ogun-server: the HTTPS bridge (O-13); version lines as in the zeus workspace where it pins them ----
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tower = "0.5"
tower-http = { version = "0.6", default-features = false }
hyper = { version = "1.11", default-features = false }
hyper-util = { version = "0.1", default-features = false }
http = "1.5"
# TLS through rustls with the ring provider (no C build of aws-lc-sys; see zeus-core's "HTTP stack" note).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
jsonwebtoken = { version = "10.4", default-features = false, features = ["rust_crypto"] }
url = { version = "2.5", features = ["serde"] }
sha2 = "0.11"
base64 = "0.23"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std", "pkcs8"] }
ciborium = "0.2"
x509-cert = { version = "0.2", default-features = false }
der = "0.7"
futures = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
