[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ogun-client"
version = "0.1.0"
description = "Python client for the ogund local API (Ogun spec O-15): handshake, NDJSON JSON-RPC over a Unix socket or Windows named pipe, typed helpers."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Verne Ltd." }]
requires-python = ">=3.9"
dependencies = ["blake3>=0.4", "typing_extensions>=4.0; python_version < '3.11'"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/ArefinAlter/ogun"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ogun_client = ["py.typed"]
