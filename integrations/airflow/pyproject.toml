[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "airflow-provider-ogun"
version = "0.1.0"
description = "Apache Airflow provider for Ogun: start runs of approved workflow versions, wait or defer, sense runs and partitions. Uses an agent credential; never approves."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Verne Ltd." }]
requires-python = ">=3.9"
dependencies = ["apache-airflow>=2.8", "ogun-client>=0.1"]
classifiers = [
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.entry-points.apache_airflow_provider]
provider_info = "ogun_airflow:get_provider_info"

[project.urls]
Repository = "https://github.com/ArefinAlter/ogun"

[tool.setuptools.packages.find]
where = ["src"]
