[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prefect-ogun"
version = "0.1.0"
description = "Prefect integration for Ogun: an OgunConnection block and tasks that start Ogun runs, wait for them and read partition state. Uses an agent credential; never approves."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Verne Ltd." }]
requires-python = ">=3.9"
dependencies = ["prefect>=2.14", "ogun-client>=0.1"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/ArefinAlter/ogun"

[tool.setuptools.packages.find]
where = ["src"]
