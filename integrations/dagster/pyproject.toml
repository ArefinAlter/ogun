[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dagster-ogun"
version = "0.1.0"
description = "Dagster integration for Ogun: an OgunResource and an asset factory that maps an Ogun workflow's partitions to Dagster partitions and materialises by starting runs. Uses an agent credential; never approves."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Verne Ltd." }]
requires-python = ">=3.9"
dependencies = ["dagster>=1.7", "ogun-client>=0.1"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/ArefinAlter/ogun"

[tool.setuptools.packages.find]
where = ["src"]
